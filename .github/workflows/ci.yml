name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    name: Check and build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec biome ci .
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm exec design.md lint DESIGN.md
      - name: Verify generated tokens match DESIGN.md
        run: |
          pnpm tokens
          git diff --exit-code src/app/theme.css
      - run: pnpm build
      - run: pnpm publish:assets --dry-run
      - run: pnpm exec wrangler deploy --dry-run --outdir .wrangler/dry-run
