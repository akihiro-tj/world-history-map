<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Design Mocks - world-history-map</title>
    <style>
      :root {
        font-family: system-ui, Avenir, Helvetica, Arial, sans-serif;
        line-height: 1.5;
        color: #1f2937;
        background: #f9fafb;
      }
      body {
        margin: 0;
        padding: 32px;
        max-width: 960px;
        margin-inline: auto;
      }
      h1 {
        font-size: 28px;
        font-weight: 600;
        margin: 0 0 8px;
      }
      .subtitle {
        color: #6b7280;
        margin: 0 0 32px;
      }
      .feature {
        background: #ffffff;
        border: 1px solid #e5e7eb;
        border-radius: 12px;
        padding: 20px 24px;
        margin-bottom: 16px;
      }
      .feature h2 {
        font-size: 18px;
        font-weight: 600;
        margin: 0 0 12px;
      }
      .versions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .version-link {
        display: inline-flex;
        align-items: center;
        padding: 6px 14px;
        border-radius: 999px;
        background: #eef2ff;
        color: #4338ca;
        text-decoration: none;
        font-size: 14px;
        font-weight: 500;
        transition: background-color 0.15s;
      }
      .version-link:hover {
        background: #e0e7ff;
      }
      .empty {
        color: #9ca3af;
        font-style: italic;
      }
    </style>
  </head>
  <body>
    <h1>Design Mocks</h1>
    <p class="subtitle">world-history-map - feature × version 一覧</p>

    <section class="feature">
      <h2>era-summary-panel — 年代サマリーパネル</h2>
      <div class="versions">
        <a class="version-link" href="./era-summary-panel/v2/index.html">v2</a>
        <a class="version-link" href="./era-summary-panel/v1/index.html">v1</a>
      </div>
    </section>
  </body>
</html>
