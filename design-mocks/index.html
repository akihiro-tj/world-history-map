<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Design Mocks — World History Map</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <style type="text/tailwindcss">
      @theme {
        --color-role-selected: #f5b13d;
        --color-role-loading: #38bdf8;
        --color-role-error: #fa5450;
        --color-role-focus: #38bdf8;
        --color-role-link: #76b2ff;
        --color-role-link-hover: #9bccff;
        --color-role-label-text: #eeeeee;
        --color-role-label-halo: #161616;
        --color-surface-base: #0a0e14;
        --color-surface-sheet: #1b2533;
        --color-surface-panel: #2d3a4cf2;
        --color-surface-raised: #ffffff24;
        --color-surface-handle: #687587;
        --color-surface-border: #3c4654;
        --color-surface-scrim: #00000080;
        --color-text-primary: #ffffff;
        --color-text-secondary: #d4d4d4;
        --color-text-tertiary: #adadad;
        --color-text-quiet: #717171;
        --color-text-dimmed: #ffffff99;
        --text-title: 20px;
        --text-title--font-weight: 700;
        --text-title--line-height: 28px;
        --text-panel-title: 20px;
        --text-panel-title--font-weight: 600;
        --text-panel-title--line-height: 28px;
        --text-section-heading: 16px;
        --text-section-heading--font-weight: 600;
        --text-section-heading--line-height: 24px;
        --text-label: 16px;
        --text-label--font-weight: 500;
        --text-label--line-height: 24px;
        --text-body: 16px;
        --text-body--line-height: 24px;
        --text-caption: 12px;
        --text-caption--line-height: 16px;
        --spacing: 4px;
      }
    </style>

    <style>
      :root {
        font-family: system-ui, Avenir, Helvetica, Arial, sans-serif;
        line-height: 1.5;
        font-weight: 400;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      :focus {
        outline: none;
      }

      :focus-visible {
        outline: 2px solid var(--color-role-focus);
        outline-offset: 2px;
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
          scroll-behavior: auto !important;
        }
      }
    </style>
  </head>

  <body class="min-h-dvh bg-surface-base text-text-secondary">
    <header class="border-b border-surface-border px-6 py-4">
      <p class="text-caption text-text-tertiary">world-history-map · design mock</p>
      <h1 class="mt-1 text-panel-title text-text-primary">Design Mocks</h1>
      <p class="mt-1 text-body text-text-tertiary">実装前デザイン確認用モック一覧</p>
    </header>

    <main class="mx-auto max-w-3xl px-6 py-10">
      <!-- design-showcase -->
      <section class="mb-10">
        <h2 class="text-section-heading text-text-primary">design-showcase</h2>
        <p class="mt-1 text-body leading-relaxed text-text-tertiary">
          DESIGN.md のトークンとコンポーネントを 1 枚に可視化したデザインシステム参照ページ
        </p>
        <ul class="mt-3 divide-y divide-surface-border overflow-hidden rounded-lg border border-surface-border bg-surface-sheet">
          <li class="flex items-center justify-between gap-4 px-4 py-3">
            <div class="min-w-0">
              <span class="font-mono text-caption text-text-primary">v1</span>
              <span class="ml-2 text-body text-text-secondary">
                色 / タイポ / spacing / shape のトークン + frosted panel・FAB・year selector・timeline・bottom sheet のギャラリー
              </span>
            </div>
            <a href="./design-showcase/v1/index.html" class="shrink-0 text-body text-role-link underline hover:text-role-link-hover">
              開く →
            </a>
          </li>
        </ul>
      </section>
    </main>
  </body>
</html>
